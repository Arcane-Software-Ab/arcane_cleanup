name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target_key: windows-x86_64
            json_name: windows-x86_64.json
          - os: macos-latest
            platform: macos
            target_key: darwin-aarch64
            json_name: darwin-aarch64.json
          - os: ubuntu-22.04
            platform: linux
            target_key: linux-x86_64
            json_name: linux-x86_64.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true

      - name: Cache Tauri CLI
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-v2-${{ runner.os }}-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: |
            tauri-cli-v2-${{ runner.os }}-

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --locked --version "^2.0.0"

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Validate updater signing secret
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "::error::Missing GitHub secret TAURI_SIGNING_PRIVATE_KEY"
            echo "Paste the full contents of ~/.tauri/arcane-cleanup.key into that secret."
            exit 1
          fi

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./backend/tauri.conf.json').version")"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "repo=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"

      - name: Build Tauri app (Windows NSIS)
        if: matrix.platform == 'windows'
        run: cargo tauri build --bundles nsis
        working-directory: backend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri app (macOS app + DMG)
        if: matrix.platform == 'macos'
        run: cargo tauri build --bundles app,dmg
        working-directory: backend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri app (Linux AppImage)
        if: matrix.platform == 'linux'
        run: cargo tauri build --bundles appimage
        working-directory: backend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect installers + updater payload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p upload
          VERSION="${{ steps.meta.outputs.version }}"
          REPO="${{ steps.meta.outputs.repo }}"
          TARGET_KEY="${{ matrix.target_key }}"
          JSON_NAME="${{ matrix.json_name }}"
          RELEASE_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          TAG_NAME="v${VERSION}"
          MANUAL_NAME=""
          UPDATER_ARTIFACT=""

          case "${{ matrix.platform }}" in
            windows)
              UPDATER_ARTIFACT="$(ls -1 backend/target/release/bundle/nsis/*.exe | head -n 1 || true)"
              MANUAL_NAME="Arcane-Cleanup-${VERSION}-windows-setup.exe"
              cp "${UPDATER_ARTIFACT}" "upload/${MANUAL_NAME}"
              ;;
            macos)
              UPDATER_ARTIFACT="$(ls -1 backend/target/release/bundle/macos/*.app.tar.gz | head -n 1 || true)"
              DMG="$(ls -1 backend/target/release/bundle/dmg/*.dmg | head -n 1 || true)"
              if [[ -z "${DMG}" || ! -f "${DMG}" ]]; then
                echo "::error::Missing macOS DMG"
                exit 1
              fi
              MANUAL_NAME="Arcane-Cleanup-${VERSION}-macos.dmg"
              cp "${DMG}" "upload/${MANUAL_NAME}"
              ;;
            linux)
              UPDATER_ARTIFACT="$(ls -1 backend/target/release/bundle/appimage/*.AppImage | head -n 1 || true)"
              MANUAL_NAME="Arcane-Cleanup-${VERSION}-linux.AppImage"
              cp "${UPDATER_ARTIFACT}" "upload/${MANUAL_NAME}"
              ;;
            *)
              echo "::error::Unsupported platform"
              exit 1
              ;;
          esac

          if [[ -z "${UPDATER_ARTIFACT}" || ! -f "${UPDATER_ARTIFACT}" ]]; then
            echo "::error::No updater artifact for ${{ matrix.platform }}"
            exit 1
          fi

          SIG_FILE="${UPDATER_ARTIFACT}.sig"
          if [[ ! -f "${SIG_FILE}" ]]; then
            echo "::error::Missing signature: ${SIG_FILE}"
            exit 1
          fi

          ARTIFACT_NAME="$(basename "${UPDATER_ARTIFACT}")"
          cp "${UPDATER_ARTIFACT}" "upload/${ARTIFACT_NAME}"
          cp "${SIG_FILE}" "upload/$(basename "${SIG_FILE}")"

          SIGNATURE="$(tr -d '\r\n' < "${SIG_FILE}")"
          # Prefer the release tag URL so updater assets stay pinned to this version.
          ARTIFACT_URL="https://github.com/${REPO}/releases/download/${TAG_NAME}/${ARTIFACT_NAME}"

          cat > "upload/${JSON_NAME}" <<EOF
{
  "version": "${VERSION}",
  "notes": "Arcane Cleanup ${VERSION}",
  "pub_date": "${RELEASE_DATE}",
  "platforms": {
    "${TARGET_KEY}": {
      "signature": "${SIGNATURE}",
      "url": "${ARTIFACT_URL}"
    }
  }
}
EOF

          # Also publish under the exact Tauri endpoint filename used by /releases/latest/download/
          ls -la upload

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcane-cleanup-${{ matrix.platform }}-${{ steps.meta.outputs.version }}
          path: upload/*
          if-no-files-found: error

  github-release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: arcane-cleanup-*
          merge-multiple: true

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=false
          if [[ "${GITHUB_REF_NAME}" == *"-beta"* ]]; then
            PRERELEASE=true
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ github.ref_name }}
          name: Arcane Cleanup v${{ steps.meta.outputs.version }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Install

            | Platform | File |
            |----------|------|
            | **Windows** | `Arcane-Cleanup-*-windows-setup.exe` |
            | **macOS** | `Arcane-Cleanup-*-macos.dmg` |
            | **Linux** | `Arcane-Cleanup-*-linux.AppImage` |

            Free and open source. Code-signed for **in-app updates** (not Apple/Microsoft notarized).

            - **Windows:** if SmartScreen blocks it, choose **More info → Run anyway**
            - **macOS:** control-click the app → **Open**
            - **Linux:** `chmod +x` the AppImage, then run it

            Installed copies check GitHub Releases on startup and can auto-update.
          files: release-assets/*
